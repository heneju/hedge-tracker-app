<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACKING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23ec3013'/><text y='.86em' x='16' font-size='78' font-weight='800' font-family='Archivo,sans-serif' fill='%23f3f2f2'>T</text></svg>">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Modernist. Tinta sobre papel: fundo quase branco, texto quase preto,
   um vermelho-laranja de acento e nenhum canto arredondado. As reguas de
   2px sao a estrutura -- e o que separa uma secao da outra, no lugar de
   caixas empilhadas.

   Claro e o padrao. O escuro nao inverte o gosto: mantem a mesma tinta e o
   mesmo acento, so troca o papel. `data-theme` no <html> decide, e a
   escolha fica no localStorage.
   ───────────────────────────────────────────────────────────────────── */
:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#ec3013;
  --color-divider:color-mix(in srgb, #201e1d 40%, transparent);

  --color-neutral-100:#f8f4f4;
  --color-neutral-200:#eae7e7;
  --color-neutral-300:#d7d3d3;
  --color-neutral-400:#bab6b6;
  --color-neutral-500:#9b9797;
  --color-neutral-600:#7d7979;
  --color-neutral-700:#605d5d;
  --color-neutral-800:#444141;
  --color-neutral-900:#2d2b2b;

  --color-accent-100:#fff2ef;
  --color-accent-200:#ffe0d9;
  --color-accent-300:#ffc4b8;
  --color-accent-400:#ff9783;
  --color-accent-500:#ff563c;
  --color-accent-600:#dd2b0f;
  --color-accent-700:#ae1800;
  --color-accent-800:#7c1405;
  --color-accent-900:#4d170e;

  /* Ganho e perda tem par proprio: um tom para texto, um tom cheio para
     bloco. O acento da marca fica so para o que e acao -- botao, aba ativa,
     chip ligado -- e nao vira sinal de resultado. */
  --gain:#0c6a49;
  --gain-fill:#0c6a49;
  --gain-ink:#ffffff;
  --loss:#c0300f;
  --loss-fill:#ae1800;
  --loss-ink:#ffffff;

  --font-heading:"Archivo",system-ui,sans-serif;
  --font-body:"Archivo",system-ui,sans-serif;

  --shadow-sm:0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);
  --shadow-md:0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);

  --shell:2000px;

  color-scheme:light;
}

html[data-theme="dark"]{
  --color-bg:#141312;
  --color-surface:#1b1918;
  --color-text:#f3f2f2;
  --color-divider:#3b3735;

  --color-neutral-100:#232120;
  --color-neutral-200:#2b2827;
  --color-neutral-300:#3b3735;
  --color-neutral-400:#6e6866;
  --color-neutral-500:#8b8582;
  --color-neutral-600:#a09a97;
  --color-neutral-700:#b3adaa;
  --color-neutral-800:#d4cfcc;
  --color-neutral-900:#f3f2f2;

  --color-accent:#ff4a2b;
  --color-accent-100:#3a1a14;
  --color-accent-200:#4d211a;
  --color-accent-300:#6b2c22;
  --color-accent-400:#b3392a;
  --color-accent-500:#ff4a2b;
  --color-accent-600:#ff6a4d;
  --color-accent-700:#ff8a70;
  --color-accent-800:#ffa793;
  --color-accent-900:#ffc9bc;

  --gain:#3ecf99;
  --gain-fill:#17624a;
  --gain-ink:#ffffff;
  /* Vivo, mas sem gritar: o salmao claro que estava aqui lavava, e o acento
     cheio (#ff4a2b) num bloco desse tamanho cansa a vista. */
  --loss:#ff6a4d;
  --loss-fill:#a32d14;
  --loss-ink:#ffffff;

  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box}
/* Regra de autor vence a do navegador: sem isto, `.field{display:flex}`
   sobrepoe o [hidden] padrao e o campo escondido continua na tela. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--color-bg);color:var(--color-text);
  font:400 13px/1.55 var(--font-body);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,h5,h6{
  font-family:var(--font-heading);font-weight:800;
  line-height:1.12;letter-spacing:-.015em;margin:0;
}
a{color:var(--color-accent-700);text-decoration:none;text-underline-offset:3px}
a:hover{color:var(--color-accent)}
button,input,select,textarea{font-family:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
::selection{background:color-mix(in srgb, var(--color-accent) 30%, transparent)}

::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--color-neutral-400)}

/* Numeros em tabela: mesma largura por digito, sem quebra de linha. */
.num,.n{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";white-space:nowrap}
.num{text-align:right}
.lbl{white-space:nowrap}

.bright{color:var(--color-text);font-weight:600}
.dim{color:var(--color-neutral-500)}
.muted{color:var(--color-neutral-700)}
.pos{color:var(--gain)}
.neg{color:var(--loss)}
/* Herdado do tema anterior; no papel claro brilho nao existe. */
.glow-green,.glow-red{text-shadow:none}

/* ------------------------------------------------------------------ chrome */
header{
  position:sticky;top:0;z-index:30;
  background:var(--color-bg);border-bottom:2px solid var(--color-divider);
  padding-top:env(safe-area-inset-top);
}
/* Cabecalho e conteudo na mesma caixa: sem isto a marca fica na borda e a
   tabela comeca no meio da tela. */
.shell{max-width:var(--shell);margin:0 auto;padding:0 32px}
.topline{display:flex;align-items:center;gap:24px;min-height:56px;flex-wrap:wrap}
header h1{
  margin:0;font-size:18px;font-weight:800;letter-spacing:-.01em;
  color:var(--color-text);
}
header .sep{color:var(--color-neutral-400)}
#section{
  font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--color-neutral-700);
}
.status{
  display:flex;align-items:center;gap:14px;margin-left:auto;
  font-size:11px;color:var(--color-neutral-700);white-space:nowrap;
  padding-left:20px;border-left:2px solid var(--color-divider);
}
.status b{font-weight:600;color:var(--color-text)}
/* Os botoes andam juntos: soltos, um cai de linha sozinho quando aperta. */
.status .actions{display:flex;gap:4px}
.dot{
  width:7px;height:7px;background:var(--color-accent);
  display:inline-block;margin-right:6px;
}

/* Alternador de tema: dois botoes colados, o ativo pintado de acento. */
.thm{display:flex;border:2px solid var(--color-divider);flex:none}
.thm button{
  appearance:none;border:0;cursor:pointer;background:transparent;
  font-family:var(--font-body);font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;
  color:var(--color-neutral-700);
}
.thm button:hover{color:var(--color-text)}
.thm button[aria-pressed="true"]{background:var(--color-accent);color:#fff}

nav{
  display:flex;gap:8px 18px;flex-wrap:wrap;padding-bottom:2px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:0;border-bottom:2px solid transparent;
  color:var(--color-text);padding:8px 0 6px;font-size:13px;
  white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
nav button:hover{color:var(--color-accent)}
nav button[aria-current="page"]{
  color:var(--color-accent);font-weight:600;border-bottom-color:var(--color-accent);
}
/* Contador de reportes/pendencias abertos, no menu. */
.pill{
  display:inline-flex;align-items:center;padding:1px 6px;
  background:var(--color-accent-100);color:var(--color-accent-800);
  font-size:10px;font-weight:600;letter-spacing:.02em;
}

/* O painel e uma tabela de 17 colunas, nao um texto: apertar a largura para
   uma medida de leitura so cria rolagem horizontal com a tela vazia dos dois
   lados. O teto existe para nao esticar num monitor de 4K. */
main{
  padding:0 32px calc(64px + env(safe-area-inset-bottom));
  max-width:var(--shell);margin:0 auto;
}

/* ------------------------------------------------------------------ pieces */
/* Faixas de metrica. As reguas sao borda de celula, nao fundo do container:
   com fundo, uma celula vazia do grid vira um retangulo cinza solto.

   Regua e recuo sao regra de COLUNA, nao estilo fixo por celula: quando o grid
   quebra, a primeira celula da linha nova nao pode continuar com regua a
   esquerda nem com recuo de meio de linha. */
.cards{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0;
  border-bottom:2px solid var(--color-divider);margin:0;
}
.cards > *{padding:24px;border-left:2px solid var(--color-divider)}
.card{display:flex;flex-direction:column;gap:0}
/* Faixa principal: o total ocupa a celula larga, os tres coadjuvantes seguem. */
.kpi{grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr))}
.ledger{grid-template-columns:repeat(5,minmax(0,1fr))}
.ledger > *{border-left-width:1px;padding-top:18px;padding-bottom:18px}
.kpi > *:nth-child(4n + 1),.ledger > *:nth-child(5n + 1){border-left:0;padding-left:0}
.kpi > *:nth-child(4n),.ledger > *:nth-child(5n){padding-right:0}
.cards > *:first-child{border-left:0;padding-left:0}
.led .value{font-size:26px;margin-top:6px}
.led .sub{font-size:11px;color:var(--color-neutral-600);margin-top:4px}
@media (max-width:1240px){
  .kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ledger{grid-template-columns:repeat(3,minmax(0,1fr))}
  .kpi > *:nth-child(4n + 1),.ledger > *:nth-child(5n + 1){
    border-left:2px solid var(--color-divider);padding-left:24px;
  }
  .ledger > *:nth-child(5n + 1){border-left-width:1px}
  .kpi > *:nth-child(4n),.ledger > *:nth-child(5n){padding-right:24px}
  .kpi > *:nth-child(2n + 1){border-left:0;padding-left:0}
  .kpi > *:nth-child(2n){padding-right:0}
  .kpi > *:nth-child(n + 3){border-top:2px solid var(--color-divider)}
  .ledger > *:nth-child(3n + 1){border-left:0;padding-left:0}
  .ledger > *:nth-child(3n){padding-right:0}
  .ledger > *:nth-child(n + 4){border-top:1px solid var(--color-divider)}
}
.card .label{
  font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  color:var(--color-neutral-700);
}
.card .value{
  font-family:var(--font-heading);font-weight:800;font-size:34px;line-height:1;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-top:10px;
}
.card .sub{font-size:12px;color:var(--color-neutral-700);margin-top:8px}

.panel{margin:28px 0 0}
.panel > h2{
  margin:0;padding:0 0 12px;border-bottom:2px solid var(--color-divider);
  font-family:var(--font-heading);font-size:12px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--color-text);
  display:flex;justify-content:space-between;align-items:baseline;gap:14px;
}
.panel > h2 .dim{font-weight:400;font-size:12px;letter-spacing:0;text-transform:none}
.panel-body{padding:16px 0 0}
/* Dois paineis lado a lado no desktop, empilhados no celular. */
.grid-2{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:0 40px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{
  position:sticky;top:0;z-index:1;background:var(--color-bg);
  padding:8px;text-align:left;white-space:nowrap;
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-neutral-700);
  border-bottom:2px solid var(--color-divider);
}
td{
  padding:8px;border-bottom:1px solid var(--color-divider);
  white-space:nowrap;color:var(--color-text);
}
tbody tr:hover{background:var(--color-neutral-100)}
tbody tr.clickable{cursor:pointer}
/* Celula editavel: um realce discreto no hover, para a tabela nao virar um
   formulario cheio de caixas. */
td.editable{cursor:text}
td.editable:hover{
  background:color-mix(in srgb, var(--color-accent) 8%, transparent);
  box-shadow:inset 0 0 0 1px var(--color-accent-400);
}
td.editable input,td.editable select{width:100%;min-width:70px}
td.locked{color:var(--color-neutral-600)}
tfoot td{
  border-top:2px solid var(--color-divider);border-bottom:0;
  color:var(--color-text);font-weight:700;background:var(--color-bg);
}

.badge{
  display:inline-flex;align-items:center;padding:3px 9px;
  font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  border:1px solid transparent;
}
.badge.phase1,.badge.phase2{background:var(--color-neutral-100);color:var(--color-neutral-800)}
.badge.passed{background:var(--color-accent-100);color:var(--color-accent-800)}
.badge.funded{background:color-mix(in srgb, var(--gain) 14%, transparent);color:var(--gain)}
.badge.failed{background:color-mix(in srgb, var(--loss) 16%, transparent);color:var(--loss);
              border-color:color-mix(in srgb, var(--loss) 40%, transparent)}
.badge.closed,.badge.prop{background:var(--color-neutral-100);color:var(--color-neutral-700)}
.badge.live{border-color:var(--color-accent);color:var(--color-accent);background:transparent}

/* ------------------------------------------------------------------ inputs */
input,select,textarea{
  font-size:13px;color:var(--color-text);background:transparent;
  border:2px solid var(--color-divider);border-radius:0;padding:5px 8px;width:100%;
  caret-color:var(--color-accent);
}
input:focus-visible,select:focus-visible,textarea:focus-visible{
  outline:2px solid var(--color-accent);outline-offset:2px;
}
input::placeholder,textarea::placeholder{color:var(--color-neutral-500)}
select option{background:var(--color-bg);color:var(--color-text)}
td input,td select{padding:3px 5px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--color-divider)}
td input.num{text-align:right}
input[type=checkbox]{width:auto;accent-color:var(--color-accent)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  cursor:pointer;text-decoration:none;
  font-family:var(--font-heading);font-weight:800;font-size:12px;line-height:1.2;
  letter-spacing:.02em;
  background:var(--color-accent);color:var(--color-bg);
  border:2px solid var(--color-accent);padding:7px 14px;
}
.btn:hover:not(:disabled){background:var(--color-accent-600);border-color:var(--color-accent-600)}
.btn.ghost{
  background:transparent;color:var(--color-text);border-color:var(--color-divider);
}
.btn.ghost:hover:not(:disabled){
  background:color-mix(in srgb, var(--color-text) 7%, transparent);
  border-color:var(--color-divider);
}
.btn.danger{background:transparent;color:var(--color-accent);border-color:var(--color-divider)}
.btn.danger:hover:not(:disabled){border-color:var(--color-accent)}
/* Botao armado: o segundo clique apaga. Fica pintado de verdade para nao
   passar por engano como se fosse o estado normal. */
.btn.armed{background:var(--color-accent);color:#fff;border-color:var(--color-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.icon{width:30px;height:30px;padding:0;font-size:13px}

.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:140px;flex:1}
/* Dentro de uma linha os campos nao esticam: um select de filtro com 400px de
   largura destoa da densidade do resto da tela. */
.row .field{flex:0 1 210px}
.row .field.wide{flex:1 1 260px}
/* Campo que so carrega um botao: encolhe ate o conteudo. */
.row .field.auto{flex:0 0 auto;min-width:0}
.field label{
  font-size:11px;letter-spacing:.1em;font-weight:600;text-transform:uppercase;
  color:var(--color-neutral-700);
}

/* ------------------------------------------------------------------- chart */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:150px;padding-top:6px}
/* max-width: com poucos meses, sem teto uma barra sozinha vira um paredao. */
.bars .col{flex:1 1 0;max-width:88px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;min-width:0}
.bars .bar{width:100%;min-height:2px;background:var(--gain)}
.bars .bar.neg{background:var(--loss)}
.bars .val{font-size:11px;font-variant-numeric:tabular-nums}
.bars .tick{font-size:10px;color:var(--color-neutral-600);white-space:nowrap;letter-spacing:.06em;text-transform:uppercase}

.blown{
  text-decoration:line-through;text-decoration-color:var(--loss);
  text-decoration-thickness:2px;color:var(--color-neutral-600);
}

.empty{padding:44px 0;color:var(--color-neutral-600);font-size:13px}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--color-text);color:var(--color-bg);
  padding:9px 18px;font-size:12px;font-weight:600;letter-spacing:.04em;
  box-shadow:var(--shadow-lg);
}

dialog{
  border:0;background:var(--color-bg);color:var(--color-text);
  padding:0;max-width:min(1100px,95vw);width:100%;box-shadow:var(--shadow-lg);
}
dialog::backdrop{background:color-mix(in srgb, var(--color-neutral-900) 55%, transparent)}
dialog[open]{animation:dialog-in .2s cubic-bezier(.2,.8,.2,1)}
@keyframes dialog-in{
  from{opacity:0;transform:translateY(12px) scale(.985)}
  to{opacity:1;transform:translateY(0) scale(1)}
}
@media (prefers-reduced-motion:reduce){
  dialog[open]{animation:none}
}
/* O cabecalho da pagina so vira flex dentro de .topline; o do modal precisa do
   seu proprio, senao titulo, badge e botoes empilham. */
dialog header{
  position:static;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:16px 24px;border-bottom:2px solid var(--color-divider);min-height:0;
}
dialog header h1{font-size:20px;letter-spacing:-.015em}
dialog header .spacer{flex:1}
dialog .panel{margin-top:24px}
dialog th{background:var(--color-bg)}

.account-picker-summary{
  min-height:38px;padding:9px 11px;border:2px solid var(--color-divider);
  color:var(--color-neutral-700);font-size:12px;line-height:1.5;
}
.account-picker-list{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:0;
  max-height:46vh;overflow:auto;border:2px solid var(--color-divider);
}
.account-picker-option{
  display:flex;align-items:center;gap:9px;padding:9px 11px;cursor:pointer;
  color:var(--color-text);font-size:12px;
  border-bottom:1px solid var(--color-divider);
}
.account-picker-option:hover{background:var(--color-neutral-100)}
.account-picker-option input{width:auto;flex:0 0 auto}

/* Barra de ferramentas de uma tela: titulo, uma linha de contexto e os
   controles, tudo assentado na mesma regua. Substitui o cabecalho de painel
   quando a tela e uma tabela so. */
.tool{
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 16px;
  border-bottom:2px solid var(--color-divider);padding-bottom:12px;margin-top:26px;
}
.tool h2{
  margin:0;font-family:var(--font-heading);font-size:12px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;border:0;padding:0;
}
.tool .hint{font-size:12px;color:var(--color-neutral-600)}
.tool .spacer{flex:1}
.tool .right{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-left:auto}

/* Filtros: botoes colados, o ativo pintado de acento. Um grupo de chips le
   melhor que tres selects quando as opcoes cabem na linha. */
.filt,.snav{display:flex;flex-wrap:wrap;gap:0}
.snav{margin-top:2px}
.filt button,.snav button{
  appearance:none;cursor:pointer;background:transparent;font-family:var(--font-body);
  font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  padding:5px 10px;color:var(--color-neutral-700);
  border:2px solid var(--color-divider);border-right-width:0;
}
.filt button:last-child,.snav button:last-child{border-right-width:2px}
.filt button:hover,.snav button:hover{color:var(--color-text)}
.filt button[aria-pressed="true"],.snav button[aria-pressed="true"]{
  background:var(--color-accent);border-color:var(--color-accent);color:#fff;
}

/* Campo enxuto para a barra: mesma altura dos chips, sem esticar a linha. */
.inp,select.inp{
  width:auto;min-width:130px;font-size:12px;padding:5px 8px;
  border:2px solid var(--color-divider);background:transparent;color:var(--color-text);
}
.chip{
  display:inline-flex;align-items:baseline;gap:6px;
  border:1px solid var(--color-divider);padding:5px 8px;font-size:11px;
}
/* Tabela de dados: linha clicavel e cabecalho colado no fundo da pagina. */
.dt tbody tr.pick{cursor:pointer}
.dt tbody tr.pick:hover > td{background:var(--color-neutral-100)}
.dt tfoot td{background:var(--color-bg)}
/* Coluna que so existe em mesa de duas fases. */
.noP2 th.p2,.noP2 td.p2{display:none}
/* Nota livre e o que estoura a largura das tabelas: ela corta com reticencias
   em vez de empurrar dezesseis colunas de numero para fora da tela. O texto
   inteiro fica no title e na linha aberta. */
.dt td.note{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.count{
  padding:10px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--color-neutral-700);
}

/* Contas vivas: um cartao por conta, com o multiplicador do dia dentro. As
   reguas sao borda dos cartoes, nao fundo do container -- com fundo, uma
   celula vazia do grid vira um retangulo cinza solto no fim da linha. */
.accts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0}
@media (min-width:1700px){
  .accts{grid-template-columns:repeat(4,minmax(0,1fr))}
  .accts > .acct:nth-child(3n + 1){border-left:2px solid var(--color-divider);padding-left:22px}
  .accts > .acct:nth-child(4n + 1){border-left:0;padding-left:0}
  .accts > .acct:nth-child(n + 4){border-top:0}
  .accts > .acct:nth-child(n + 5){border-top:2px solid var(--color-divider)}
}
.acct{padding:20px 22px 22px;border-left:2px solid var(--color-divider)}
.accts > .acct:nth-child(3n + 1){border-left:0;padding-left:0}
.accts > .acct:nth-child(n + 4){border-top:2px solid var(--color-divider)}
@media (max-width:1240px){
  .accts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .accts > .acct:nth-child(3n + 1){border-left:2px solid var(--color-divider);padding-left:22px}
  .accts > .acct:nth-child(2n + 1){border-left:0;padding-left:0}
  .accts > .acct:nth-child(n + 3){border-top:2px solid var(--color-divider)}
}
@media (max-width:820px){
  .accts{grid-template-columns:minmax(0,1fr)}
  .accts > .acct{border-left:0 !important;padding-left:0 !important}
  .accts > .acct:nth-child(n + 2){border-top:2px solid var(--color-divider)}
}

/* Tela Hedge: um cartao por conta, com o multiplicador em tamanho de leitura
   rapida. O numero e o motivo da tela existir, entao ele domina o cartao --
   tudo em volta esta ali so para justificar de onde ele saiu. */
.mult-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:0}
.mult-card{
  padding:20px 22px 22px;border-left:2px solid var(--color-divider);
  border-top:2px solid var(--color-divider);
}
.mult-card.off{opacity:.55}
.mult-head{
  display:flex;align-items:baseline;gap:10px;font-size:11px;
  border-bottom:2px solid var(--color-divider);padding-bottom:12px;margin-bottom:16px;
}
.mult-head .spacer{flex:1}
.mult-value{
  font-family:var(--font-heading);font-weight:800;font-size:44px;line-height:.9;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--color-accent);
}
.mult-off{font-size:22px;color:var(--color-neutral-500);letter-spacing:.06em}
.mult-caption{
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--color-neutral-700);margin-top:6px;
}
.mult-math{
  margin-top:16px;padding-top:14px;border-top:2px solid var(--color-divider);
  font-size:12px;color:var(--color-neutral-700);font-variant-numeric:tabular-nums;
}
.mult-breakdown{width:100%;margin-top:8px;font-size:12px}
.mult-breakdown td{padding:3px 0;border:0;color:var(--color-neutral-700)}
.mult-breakdown tr:hover{background:transparent}
.mult-breakdown tr.total td{
  border-top:1px solid var(--color-divider);padding-top:5px;color:var(--color-text);
}
.mult-target{margin-top:12px;font-size:12px;color:var(--color-neutral-700)}
.mult-days{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mult-days .chip{
  border:1px solid var(--color-divider);padding:5px 8px;font-size:11px;
  color:var(--color-neutral-700);display:flex;gap:6px;align-items:baseline;
}
.mult-foot{margin-top:10px;font-size:11px;color:var(--color-neutral-600)}
/* Aviso de que o numero nao da para confiar ainda, com o que fazer a respeito. */
.mult-note{
  margin-top:12px;padding:9px 11px;font-size:11px;line-height:1.6;
  border-left:2px solid var(--color-accent);background:var(--color-accent-100);
  color:var(--color-accent-900);
}
.mult-actions{margin-top:14px}

/* Aviso do que falta cadastrar. Um bloco por pendência, com o porquê acima do
   campo: sem o motivo o aviso vira burocracia e a pessoa fecha sem preencher. */
.pending-item{
  border-left:2px solid var(--color-accent);background:var(--color-accent-100);
  padding:12px 14px;margin-bottom:12px;color:var(--color-accent-900);
}
.pending-head{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:13px}
.pending-why{margin:7px 0 0;font-size:11px;line-height:1.7}
.pending-item .btn.ghost{border-color:var(--color-accent-300);color:var(--color-accent-900)}

@media (max-width:900px){
  .grid-2{grid-template-columns:minmax(0,1fr);gap:0}
}
@media (max-width:640px){
  main{padding:0 14px 40px}
  .shell{padding:0 14px}
  .topline{min-height:0;padding:10px 0;gap:12px}
  /* Sem wrap a barra empurra os botoes para fora e a pagina inteira ganha
     rolagem horizontal. */
  .status{margin-left:0;width:100%;gap:10px 12px;font-size:10px;flex-wrap:wrap;
          padding-left:0;border-left:0}
  .cards,.kpi,.ledger{grid-template-columns:minmax(0,1fr) !important}
  .cards > *{padding:18px 0 !important;border-left:0 !important}
  .kpi > *:nth-child(n + 2){border-top:2px solid var(--color-divider)}
  .ledger > *:nth-child(n + 2){border-top:1px solid var(--color-divider)}
  .cards > *:first-child{border-top:0}
  .card .value{font-size:26px}
  .mult-value{font-size:36px}
  .mult-card{padding:18px 0;border-left:0}
  /* Dois campos por linha: empilhados, tres filtros ocupam meia tela. */
  .row .field,.row .field.wide{flex:1 1 calc(50% - 6px);min-width:0}
  /* O botao pega a linha inteira -- meia largura corta o texto. */
  .row .field.auto{flex:1 1 100%}
  .row .field.auto .btn{width:100%}
  th,td{padding:7px 6px}
  .bars{height:110px}
  .bars .val{display:none}
}
</style>
</head>
<body>

<header>
  <div class="shell">
    <div class="topline">
      <h1>TRACKING</h1>
      <span class="sep">/</span>
      <span id="section"></span>
      <div class="status" id="status"></div>
    </div>
    <nav id="nav"></nav>
  </div>
</header>

<main id="view"><div class="empty">carregando</div></main>

<dialog id="modal"></dialog>

<script>
  // Antes do app: sem isto a pagina pinta clara e so depois vira escura.
  try {
    var t = localStorage.getItem("tracking:theme");
    if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
</script>
<script type="module" src="./js/app.js?v=155e87b24e"></script>
</body>
</html>
