<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRACKING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%230a0a0a'/><text y='.85em' x='14' font-size='74' font-family='monospace' fill='%2300cc88'>T</text></svg>">
<style>
/* Terminal. Escuro por definicao -- e uma tela de operacao, nao um site. */
:root{
  --bg:#0a0a0a;
  --panel:#0d0d0d;
  --panel-2:#111;
  --line:#2a2a2a;
  --line-soft:#1e1e1e;
  --line-faint:#111;

  --text:#e0e0e0;
  --bright:#fff;
  --dim:#888;
  --dimmer:#666;
  --dimmest:#555;
  --ghost:#444;
  --ghostest:#333;

  --up:#00cc00;
  --up-soft:#00cc44;
  --accent:#00cc88;
  --down:#cc0000;
  --down-soft:#cc2222;
  --info:#4488ff;
  --warn:#ccaa00;
  --gold:#ffd700;
}
*{box-sizing:border-box}
/* Regra de autor vence a do navegador: sem isto, `.field{display:flex}`
   sobrepoe o [hidden] padrao e o campo escondido continua na tela. */
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:12px/1.5 'Roboto Mono','Courier New',monospace;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
button,input,select,textarea{font-family:inherit}

::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--ghostest)}

.bright{color:var(--bright)}
.dim{color:var(--dimmest)}
.pos{color:var(--up)} .neg{color:var(--down)} .muted{color:var(--dimmest)}
.glow-green{text-shadow:0 0 8px rgba(0,204,0,.55)}
.glow-red{text-shadow:0 0 8px rgba(204,0,0,.55)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

/* ------------------------------------------------------------------ chrome */
header{
  position:sticky; top:0; z-index:30;
  background:var(--panel); border-bottom:1px solid var(--line);
  padding:0 14px; padding-top:env(safe-area-inset-top);
}
.topline{display:flex;align-items:center;gap:12px;height:34px}
header h1{
  margin:0; font-size:12px; font-weight:700; letter-spacing:.28em;
  color:var(--bright); text-shadow:0 0 10px rgba(255,255,255,.35);
}
header .sep{color:var(--ghostest)}
.status{
  display:flex; align-items:center; gap:16px; margin-left:auto;
  font-size:10px; color:var(--dimmest); white-space:nowrap;
}
.status b{font-weight:600;color:var(--bright)}
/* Os botoes andam juntos: soltos, um cai de linha sozinho quando aperta. */
.status .actions{display:flex;gap:6px}
.dot{
  width:5px;height:5px;border-radius:50%;background:var(--accent);
  display:inline-block;margin-right:5px;box-shadow:0 0 6px var(--accent);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

nav{display:flex;gap:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  background:none;border:none;border-bottom:2px solid transparent;
  color:var(--ghost); padding:7px 15px; font-size:10px; font-weight:600;
  letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; cursor:pointer;
  transition:color .15s;
}
nav button:hover{color:var(--dim)}
/* Contador de reportes abertos, no menu. */
    .pill {
      display: inline-block; margin-left: 5px; padding: 0 5px;
      border-radius: 7px; background: var(--accent); color: #000;
      font-size: 9px; font-weight: 700; line-height: 14px;
    }

    nav button[aria-current="page"]{color:var(--bright);border-bottom-color:var(--bright);background:#151515}

main{padding:14px;padding-bottom:calc(40px + env(safe-area-inset-bottom));max-width:1700px;margin:0 auto}

/* ------------------------------------------------------------------ pieces */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--line-soft);padding:10px 13px;display:flex;flex-direction:column;gap:3px}
.card .label{font-size:9px;letter-spacing:.15em;font-weight:600;color:var(--dimmest);text-transform:uppercase}
.card .value{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card .sub{font-size:9px;color:var(--ghost);letter-spacing:.05em}

.panel{background:var(--panel);border:1px solid var(--line-soft);margin-bottom:12px}
.panel > h2{
  margin:0;padding:6px 10px;border-bottom:1px solid var(--line-soft);
  font-size:9px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--dimmest);
  display:flex;justify-content:space-between;align-items:center;
}
.panel-body{padding:12px}
.panel > h2 .dim{font-weight:600}
/* Dois paineis lado a lado no desktop, empilhados no celular. */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-2 > .panel{margin-bottom:0}
.grid-2{margin-bottom:12px}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:11px}
th{
  position:sticky;top:0;z-index:1;background:var(--panel);
  padding:7px 9px;text-align:left;white-space:nowrap;
  font-size:9px;font-weight:600;letter-spacing:.1em;color:var(--ghost);text-transform:uppercase;
  border-bottom:1px solid var(--line-soft);
}
td{padding:6px 9px;border-bottom:1px solid var(--line-faint);white-space:nowrap;color:#bbb}
tbody tr:hover{background:rgba(255,255,255,.015)}
tbody tr.clickable{cursor:pointer}
/* Celula editavel: um tracejado discreto que so aparece no hover, para a
   tabela nao virar um formulario cheio de caixas. */
td.editable{cursor:text}
td.editable:hover{background:rgba(85,153,255,.07);box-shadow:inset 0 0 0 1px rgba(85,153,255,.35)}
td.editable input,td.editable select{width:100%;min-width:70px}
td.locked{color:var(--dim)}
td.locked:hover{background:rgba(255,255,255,.02)}
tfoot td{border-top:1px solid var(--line-soft);border-bottom:none;color:var(--text);font-weight:700;background:var(--panel)}

.badge{
  display:inline-block;padding:2px 8px;border-radius:3px;
  font-size:8px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border:1px solid transparent;
}
.badge.phase1{background:rgba(68,136,255,.12);color:var(--info);border-color:rgba(68,136,255,.25)}
.badge.phase2{background:rgba(204,170,0,.12);color:var(--warn);border-color:rgba(204,170,0,.25)}
.badge.funded{background:rgba(0,204,0,.12);color:var(--up);border-color:rgba(0,204,0,.25)}
.badge.failed{background:rgba(204,0,0,.12);color:var(--down);border-color:rgba(204,0,0,.25)}
.badge.closed,.badge.live,.badge.prop{background:rgba(120,120,120,.1);color:var(--dim);border-color:rgba(120,120,120,.22)}
.badge.live{background:rgba(0,204,136,.1);color:var(--accent);border-color:rgba(0,204,136,.25)}

/* ------------------------------------------------------------------ inputs */
input,select,textarea{
  font-size:11px;color:var(--text);background:#0b0b0b;
  border:1px solid var(--line);border-radius:0;padding:6px 8px;width:100%;
  transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dim)}
input::placeholder,textarea::placeholder{color:var(--ghostest)}
td input,td select{padding:3px 5px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--line)}
td input.num{text-align:right}

.btn{
  background:transparent;border:1px solid var(--line);color:var(--accent);
  font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  padding:6px 14px;cursor:pointer;transition:border-color .15s,color .15s;
}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.ghost{color:var(--dim)}
.btn.ghost:hover:not(:disabled){border-color:var(--dim);color:var(--text)}
.btn.danger{color:var(--down-soft)}
.btn.danger:hover:not(:disabled){border-color:var(--down-soft)}
/* Botao armado: o segundo clique apaga. Fica vermelho de verdade para nao
   passar por engano como se fosse o estado normal. */
.btn.armed{color:#fff;background:var(--down-soft);border-color:var(--down-soft)}
.btn:disabled{opacity:.35;cursor:default}
.btn.icon{padding:5px 9px;letter-spacing:0;font-size:11px}

.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:140px;flex:1}
/* Dentro de uma linha os campos nao esticam: um select de filtro com 400px de
   largura destoa da densidade do resto da tela. */
.row .field{flex:0 1 210px}
.row .field.wide{flex:1 1 260px}
/* Campo que so carrega um botao: encolhe ate o conteudo. */
.row .field.auto{flex:0 0 auto;min-width:0}
.field label{font-size:9px;letter-spacing:.15em;font-weight:600;color:var(--dimmest);text-transform:uppercase}

/* ------------------------------------------------------------------- chart */
.bars{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:150px;padding-top:6px}
/* max-width: com poucos meses, sem teto uma barra sozinha vira um paredao. */
.bars .col{flex:1 1 0;max-width:88px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bars .bar{width:100%;min-height:2px;background:var(--up);opacity:.75;transition:opacity .15s}
.bars .col:hover .bar{opacity:1;box-shadow:0 0 10px rgba(0,204,0,.4)}
.bars .bar.neg{background:var(--down)}
.bars .col:hover .bar.neg{box-shadow:0 0 10px rgba(204,0,0,.4)}
.bars .val{font-size:9px;font-variant-numeric:tabular-nums}
.bars .tick{font-size:9px;color:var(--ghost);white-space:nowrap;letter-spacing:.05em;text-transform:uppercase}

.blown{text-decoration:line-through;text-decoration-color:var(--down);
        text-decoration-thickness:2px;color:var(--dimmer)}

.empty{padding:34px 14px;text-align:center;color:var(--ghost);font-size:10px;letter-spacing:.15em;text-transform:uppercase}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  padding:8px 16px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  box-shadow:0 0 24px rgba(0,0,0,.7);
}

dialog{
  border:1px solid var(--line);background:var(--panel);color:var(--text);
  padding:0;max-width:min(1000px,95vw);width:100%;
}
dialog::backdrop{background:rgba(0,0,0,.72)}
/* O cabecalho da pagina so vira flex dentro de .topline; o do modal precisa do
   seu proprio, senao titulo, badge e botoes empilham. */
dialog header{
  position:static;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:9px 12px;border-bottom:1px solid var(--line);
}
dialog header h1{font-size:11px;letter-spacing:.2em;text-shadow:none}
dialog header .spacer{flex:1}
dialog .panel{background:#0b0b0b}
dialog .panel > h2{background:#0b0b0b}
dialog th{background:#0b0b0b}

@media (max-width:640px){
  main{padding:10px}
  header{padding:0 10px}
  .topline{height:auto;padding:8px 0;flex-wrap:wrap}
  /* Sem wrap a barra empurra os botoes para fora e a pagina inteira ganha
     rolagem horizontal. */
  .status{margin-left:0;width:100%;gap:10px 12px;font-size:9px;flex-wrap:wrap}
  .status .btn.icon{padding:4px 8px}
  .card .value{font-size:15px}
  /* Dois campos por linha: empilhados, tres filtros ocupam meia tela. */
  .row .field,.row .field.wide{flex:1 1 calc(50% - 5px);min-width:0}
  /* O botao pega a linha inteira -- meia largura corta o texto. */
  .row .field.auto{flex:1 1 100%}
  .row .field.auto .btn{width:100%}
  th,td{padding:6px 7px}
  .bars{height:110px}
  .bars .val{display:none}
  .grid-2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header>
  <div class="topline">
    <h1>TRACKING</h1>
    <span class="sep">/</span>
    <span id="section" style="font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase"></span>
    <div class="status" id="status"></div>
  </div>
  <nav id="nav"></nav>
</header>

<main id="view"><div class="empty">carregando</div></main>

<dialog id="modal"></dialog>

<script type="module" src="./js/app.js?v=5dd4d7c927"></script>
</body>
</html>
