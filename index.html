<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hedge Tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
:root{
  --bg:#f6f7f9; --surface:#fff; --surface-2:#f0f2f5; --border:#dfe3e8;
  --text:#14171c; --muted:#666e7a; --accent:#2f6df6;
  --pos:#0b8a4a; --neg:#c92a2a; --warn:#a86500;
  --radius:10px; --gap:14px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --surface-2:#1e242c; --border:#2a323c;
    --text:#e6e9ee; --muted:#98a2b0; --accent:#5b8dff;
    --pos:#3ecf8e; --neg:#ff6b6b; --warn:#e0a63a;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1e242c; --border:#2a323c;
  --text:#e6e9ee; --muted:#98a2b0; --accent:#5b8dff;
  --pos:#3ecf8e; --neg:#ff6b6b; --warn:#e0a63a;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;
}
a{color:var(--accent)}
button{font:inherit;cursor:pointer}

/* ------------------------------------------------------------- layout */
header{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--border); padding:10px 16px;
  padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
header .spacer{flex:1}
nav{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch}
nav button{
  background:none;border:1px solid transparent;color:var(--muted);
  padding:6px 11px;border-radius:99px;white-space:nowrap;font-size:13px;
}
nav button:hover{color:var(--text);background:var(--surface-2)}
nav button[aria-current="page"]{background:var(--accent);color:#fff;border-color:transparent}
main{padding:16px;padding-bottom:calc(32px + env(safe-area-inset-bottom));max-width:1500px;margin:0 auto}

/* -------------------------------------------------------------- pieces */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:var(--gap);margin-bottom:var(--gap)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 15px}
.card .label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.card .value{font-size:22px;font-weight:640;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.card .sub{font-size:12px;color:var(--muted);margin-top:2px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:var(--gap);overflow:hidden}
.panel > h2{
  font-size:13px;margin:0;padding:11px 15px;border-bottom:1px solid var(--border);
  font-weight:620;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;
}
.panel-body{padding:15px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{
  font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;
  font-weight:600;position:sticky;top:0;background:var(--surface);z-index:1;
}
tbody tr:hover{background:var(--surface-2)}
tbody tr.clickable{cursor:pointer}

.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;border:1px solid transparent}
.badge.phase1{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.badge.phase2{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.funded{background:color-mix(in srgb,var(--pos) 15%,transparent);color:var(--pos)}
.badge.failed{background:color-mix(in srgb,var(--neg) 13%,transparent);color:var(--neg)}
.badge.closed,.badge.live,.badge.prop{background:var(--surface-2);color:var(--muted);border-color:var(--border)}

input,select,textarea{
  font:inherit;color:var(--text);background:var(--surface);
  border:1px solid var(--border);border-radius:7px;padding:7px 9px;width:100%;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
td input,td select{padding:4px 6px;border-color:transparent;background:transparent}
td input:hover,td select:hover{border-color:var(--border)}
td input.num{text-align:right}

.btn{background:var(--accent);color:#fff;border:none;border-radius:7px;padding:8px 14px;font-weight:560}
.btn.ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px;min-width:150px;flex:1}
.field label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}

.bars{display:flex;align-items:flex-end;gap:5px;height:150px;padding-top:8px}
.bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bars .bar{width:100%;border-radius:3px 3px 0 0;min-height:2px;background:var(--accent)}
.bars .bar.neg{background:var(--neg)}
.bars .tick{font-size:10.5px;color:var(--muted);white-space:nowrap;transform:rotate(-45deg);transform-origin:center;margin-top:6px}

.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;
  background:var(--text);color:var(--bg);padding:9px 16px;border-radius:99px;
  font-size:13px;box-shadow:0 6px 24px rgba(0,0,0,.28);
}
dialog{
  border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);
  padding:0;max-width:min(940px,94vw);width:100%;
}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog header{position:static;border-radius:12px 12px 0 0;padding-top:12px}

@media (max-width:640px){
  main{padding:12px}
  header{padding:9px 12px}
  .card .value{font-size:19px}
  th,td{padding:7px 8px}
}
</style>
</head>
<body>

<header>
  <h1>⚖️ Hedge Tracker</h1>
  <nav id="nav"></nav>
  <span class="spacer"></span>
  <button class="btn ghost" id="refresh" title="Recarregar">↻</button>
  <button class="btn ghost" id="theme" title="Tema">◐</button>
</header>

<main id="view"><div class="empty">Carregando…</div></main>

<dialog id="modal"></dialog>

<script type="module" src="./js/app.js"></script>
</body>
</html>
